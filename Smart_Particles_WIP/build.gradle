plugins {
    id 'java-library'
    id 'maven-publish'
    // FIX: Use NeoGradle 7 for 1.20.5. Do NOT use 'net.neoforged.moddev'.
    id 'net.neoforged.gradle.userdev' version '7.0.145'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

base {
    archivesName = project.mod_id
}

java {
    toolchain {
        // Minecraft 1.20.5 requires Java 21
        languageVersion = JavaLanguageVersion.of(21)
    }
}

// This block works ONLY if 'net.neoforged.gradle.userdev' is applied above
minecraft {
    mappings channel: 'official', version: '1.20.5'
    
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            // This property is required for NeoGradle to identify your mod
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${project.neoforge_version}"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            mod_version: project.mod_version
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}